
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atalhos - Mapa de Mobilidade</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            padding: 18px;
            background: #2e7d32;
            color: white;
        }

        h1 {
            margin: 0;
        }

        #mapa {
            height: 80vh;
            width: 100%;
        }

        .controles {
            padding: 15px;
            background: white;
        }

        input, button {
            padding: 10px;
            font-size: 16px;
        }

        button {
            background: #2e7d32;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>Atalhos</h1>
        <p>Sua mobilidade, de um jeito mais simples.</p>
    </header>

    <div class="controles">
        <label for="linha">Código da linha:</label>
        <input id="linha" value="013">
        <button onclick="carregarLinha()">Buscar linha</button>
        <p id="mensagem">Carregando mapa...</p>
    </div>

    <div id="mapa"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const mapa = L.map('mapa').setView([-8.05, -34.9], 12);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(mapa);

        let trajeto = null;

        // Marcadores das paradas da linha selecionada
        let marcadores = L.layerGroup().addTo(mapa);

        // Todas as paradas do GTFS
        let todasParadas = [];

        // Camada dos marcadores gerais
        let marcadoresTodasParadas = L.layerGroup().addTo(mapa);


        // Busca todas as paradas na API
        async function carregarTodasParadas() {
            const resposta = await fetch('/rotas/api/paradas/');
            const dados = await resposta.json();

            todasParadas = dados.paradas;
        }


        // Atualiza as paradas conforme o zoom e a área visível
        function atualizarParadasVisiveis() {
            marcadoresTodasParadas.clearLayers();

            // Só mostra as paradas a partir do zoom 14
            if (mapa.getZoom() < 14) {
                return;
            }

            const limites = mapa.getBounds();

            todasParadas.forEach(parada => {
                const posicao = [
                    parada.latitude,
                    parada.longitude
                ];

                // Verifica se a parada está na área visível
                if (limites.contains(posicao)) {
                    L.circleMarker(posicao, {
                        radius: 4,
                        color: '#2e7d32',
                        fillColor: '#4caf50',
                        fillOpacity: 0.8
                    })
                    .bindPopup(parada.nome)
                    .addTo(marcadoresTodasParadas);
                }
            });
        }


        // Atualiza os marcadores quando o mapa é movido ou aproximado
        mapa.on('zoomend moveend', atualizarParadasVisiveis);


        // Busca e exibe o itinerário de uma linha
        async function carregarLinha() {
            const codigo = document.getElementById('linha').value;
            const mensagem = document.getElementById('mensagem');

            mensagem.textContent = 'Buscando itinerário...';

            try {
                const resposta = await fetch(
                    `/rotas/api/linhas/${codigo}/itinerario/`
                );

                const dados = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(dados.erro);
                }

                // Remove o trajeto anterior
                if (trajeto) {
                    mapa.removeLayer(trajeto);
                }

                // Monta as coordenadas do trajeto
                const pontos = dados.coordenadas.map(ponto => [
                    ponto.latitude,
                    ponto.longitude
                ]);

                // Desenha a linha no mapa
                trajeto = L.polyline(pontos, {
                    color: '#2e7d32',
                    weight: 5
                }).addTo(mapa);

                mapa.fitBounds(trajeto.getBounds());

                // Limpa os marcadores da linha anterior
                marcadores.clearLayers();

                // Adiciona as paradas da linha selecionada
                dados.paradas.forEach(parada => {
                    const marcador = L.marker([
                        parada.latitude,
                        parada.longitude
                    ]);

                    marcador.bindPopup(`
                        <strong>${parada.nome}</strong><br>
                        Parada ${parada.ordem}
                    `);

                    marcador.addTo(marcadores);
                });

                mensagem.textContent =
                    `Linha ${dados.linha} - ${dados.nome}`;

            } catch (erro) {
                mensagem.textContent = erro.message;
            }
        }


        // Carrega todas as paradas antes de atualizar os marcadores
        carregarTodasParadas()
            .then(() => {
                atualizarParadasVisiveis();
            })
            .catch(erro => {
                console.error('Erro ao carregar paradas:', erro);
            });

        // Carrega a linha inicial
        carregarLinha();

    </script>

</body>
</html>
